name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push can leave two runs racing over the same commit, each holding a
# Neon branch. Only the newest is worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The Reading engine is a pure module, so its suite needs no database and
      # belongs here rather than in the job that rents a Neon branch.
      - run: pnpm test
      # Preview deployments are switched off, so this is the only place a
      # production build is attempted before `main` tries it for real.
      - run: pnpm build

  e2e:
    # Only on pull requests: every run takes a Neon branch of its own, and there
    # is no reason to spend one on a push that no one is reviewing yet.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The whole job takes about five minutes. Left unbounded, a stalled step —
    # `playwright install` waiting on apt has done it once — runs for the six
    # hours GitHub allows before anyone notices.
    timeout-minutes: 20
    env:
      NEON_BRANCH: ci-pr-${{ github.event.number }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Read the linked Neon project
        run: echo "NEON_PROJECT_ID=$(jq -r .projectId .neon)" >> "$GITHUB_ENV"

      # A branch of its own means the suite writes nowhere near production, and
      # that migrations are proven against a database that has only ever seen
      # them. It forks `development`, not the default branch, so the run never
      # holds a copy of production data. The expiry is a safety net: if cleanup
      # below never runs, Neon collects the branch instead of leaving it to
      # pile up.
      #
      # The API is asked directly rather than through `neon`, the CLI: three
      # `npx -y neon@latest` calls spent three and a half minutes of every run
      # downloading a package nothing here caches, and one request answers all
      # three questions this step used to ask. `curl` and `jq` are already on
      # the runner.
      - name: Create a Neon branch for this run
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID"
          auth=(--fail-with-body -sS -H "Authorization: Bearer $NEON_API_KEY" -H 'Content-Type: application/json')

          parent=$(curl "${auth[@]}" "$api/branches" |
            jq -re '.branches[] | select(.name == "development") | .id')

          # Asking for the compute in the same request is what makes the reply
          # carry the connection strings: a branch with nothing to connect to
          # has none.
          created=$(curl "${auth[@]}" "$api/branches" --data "$(jq -n \
            --arg parent "$parent" --arg name "$NEON_BRANCH" \
            --arg expiry "$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" \
            '{ branch: { parent_id: $parent, name: $name, expires_at: $expiry },
               endpoints: [{ type: "read_write" }] }')")

          # The branch is deleted below by its id, which is not its name.
          echo "NEON_BRANCH_ID=$(jq -re .branch.id <<< "$created")" >> "$GITHUB_ENV"

          # Migrations connect directly: the pooler runs in transaction mode and
          # drops the session state a migration relies on. Production splits the
          # two the same way, so the suite exercises the split as well. One
          # string is handed back, and the pooled host is the same host under
          # another name.
          connection=$(jq -re '.connection_uris[0]' <<< "$created")
          direct=$(jq -re .connection_uri <<< "$connection")
          host=$(jq -re .connection_parameters.host <<< "$connection")
          pooler=$(jq -re .connection_parameters.pooler_host <<< "$connection")
          pooled=${direct/"$host"/$pooler}
          echo "::add-mask::$direct"
          echo "::add-mask::$pooled"
          echo "DIRECT_DATABASE_URL=$direct" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$pooled" >> "$GITHUB_ENV"

      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.DIRECT_DATABASE_URL }}

      # The password only has to outlive the preview server it seals sessions
      # for, so the run makes its own rather than borrowing a stored secret.
      - name: Seal sessions with a password for this run only
        run: echo "NUXT_SESSION_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Delete the Neon branch
        # Nothing to delete when the step above is what failed, and the expiry
        # collects the branch if the runner dies before this ever runs.
        if: always() && env.NEON_BRANCH_ID != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          curl --fail-with-body -sS -X DELETE \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$NEON_BRANCH_ID" \
            > /dev/null
