name: CI

on:
  # A push to dev is a squash landing: dev-health reads its result and pulls the
  # brake when it fails.
  push:
    branches: [main, dev]
  pull_request:

# A force-push can leave two runs racing over the same commit, each building
# and testing it. Only the newest is worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The Reading engine is a pure module, so its suite needs no database and
      # belongs here rather than in the job that makes one.
      - run: pnpm test
      # Preview deployments are switched off, so this is the only place a
      # production build is attempted before `main` tries it for real.
      - run: pnpm build

  e2e:
    # Only on pull requests: the suite is the slow half of CI, and a push that
    # nothing has asked to land yet has no use for it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The whole job takes about four minutes. Left unbounded, a stalled step —
    # `playwright install` waiting on apt did it once, before it stopped asking
    # apt for anything — runs for the six hours GitHub allows before anyone
    # notices.
    timeout-minutes: 20
    # The suite's database is made here, for this run, and thrown away with the
    # runner: a Postgres that has only ever seen the migrations, behind a proxy
    # that speaks Neon's HTTP protocol to the serverless driver. It used to be a
    # Neon branch forked from `development`, in the project production lives in,
    # until the runs spent that project's free quota and Neon suspended every
    # compute in it, production's with them — see
    # `docs/adr/0075-the-suite-brings-its-own-database.md`. The containers are
    # `compose.yaml`'s, the same a development machine starts: a service
    # container here could not be given the Postgres settings the suite needs.
    env:
      # `db.localtest.me` resolves to the machine itself, and
      # `server/db/endpoint.ts` sends a connection string naming it to the proxy
      # on the port it carries.
      DATABASE_URL: postgres://postgres:postgres@db.localtest.me:4445/main
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Every migration, in order, on a database that has seen nothing else: what
      # the deploy will run against production, proven by the same
      # `drizzle-kit migrate` before the pull request can go green.
      - name: Make this run's database and apply the migrations to it
        run: pnpm test:db

      # The password only has to outlive the preview server it seals sessions
      # for, so the run makes its own rather than borrowing a stored secret.
      - name: Seal sessions with a password for this run only
        run: echo "NUXT_SESSION_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # `--with-deps` is not asked for: the runner image already carries the
      # libraries a headless Chromium links against, and the apt run it added
      # was both half a minute and the one step that has ever hung here.
      #
      # The browser and the build have nothing to say to each other, so they are
      # fetched and written at once and the step costs the longer of the two
      # rather than the sum. `pnpm preview` in `playwright.config.ts` then finds
      # `.output` already there.
      - name: Fetch the browser while the app builds
        run: |
          pnpm exec playwright install chromium &
          browser=$!
          pnpm build
          wait "$browser"

      - run: pnpm test:e2e

      # Always, and not only on a red run. A red run has to explain itself, and a
      # green one still carries the numbers the suite measured and attached — the
      # controls on screen `0043` stands on among them — which nothing else in a
      # green run leaves behind.
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
