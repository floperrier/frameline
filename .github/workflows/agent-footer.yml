# Pied d'outil — workflow GitHub Actions, déclenché par ce que poste une session cloud
# Lit : le commentaire, l'issue ou la description de PR qui vient d'être écrit
# Écrit : le même texte sans le pied que l'outil GitHub du cloud y ajoute, et qu'aucun
#         réglage n'éteint ; l'historique d'édition garde l'original
name: agent-footer
on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]
permissions:
  issues: write
  pull-requests: write
jobs:
  strip:
    if: contains(github.event.comment.body || github.event.issue.body || github.event.pull_request.body, 'Generated by [Claude Code]')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ github.event.comment.body || github.event.issue.body || github.event.pull_request.body }}
          # A pull request's description is written through the issues endpoint too.
          TARGET: ${{ github.event.comment && format('issues/comments/{0}', github.event.comment.id) || format('issues/{0}', github.event.issue.number || github.event.pull_request.number) }}
        run: |
          body=$(printf '%s' "$BODY" | perl -0777 -pe 's{\s*(?:---\s*)?_Generated by \[Claude Code\]\(https://claude\.ai/code\)_\s*\z}{}')
          [ "$body" = "$(printf '%s' "$BODY")" ] && exit 0
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/$TARGET" -f body="$body" > /dev/null
