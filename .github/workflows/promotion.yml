# Promotion — workflow déclenché à chaque push sur dev, sans modèle
# Lit : les squashs de dev depuis la dernière promotion
# Écrit : une PR brouillon dev → main, avec le journal regroupé par type de commit.
#         Tu la relis, la passes en prête et la merges en merge commit.
name: promotion
on:
  push:
    branches: [dev]
permissions:
  contents: read
env:
  REPO: ${{ github.repository }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      # A pull request opened with GITHUB_TOKEN would run no CI, and main's ruleset
      # waits on it.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git fetch origin main
          log=$(git log --first-parent --format='%s' origin/main..origin/dev)
          [ -n "$log" ] || exit 0
          {
            echo "Promotion de dev vers main. Relis d'abord les nouvelles dépendances et les zones à relire, puis le journal et le diff cumulé, passe la PR en prête, puis merge en merge commit."
            echo
            # New direct dependencies (package.json) and new crates (Cargo.lock).
            deps=""
            q='[.dependencies, .devDependencies, .optionalDependencies, .peerDependencies] | map((. // {}) | keys) | add | .[]'
            for f in $(git diff --name-only origin/main origin/dev -- '*package.json'); do
              before=$( (git show "origin/main:$f" 2>/dev/null || echo '{}') | jq -r "$q" | sort -u)
              after=$( (git show "origin/dev:$f" 2>/dev/null || echo '{}') | jq -r "$q" | sort -u)
              deps="$deps$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | sed "s#^#$f : #")"$'\n'
            done
            for f in $(git diff --name-only origin/main origin/dev -- '*Cargo.lock'); do
              before=$( (git show "origin/main:$f" 2>/dev/null || true) | sed -n 's/^name = "\(.*\)"/\1/p' | sort -u)
              after=$(git show "origin/dev:$f" | sed -n 's/^name = "\(.*\)"/\1/p' | sort -u)
              deps="$deps$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | sed "s#^#$f : #")"$'\n'
            done
            deps=$(printf '%s' "$deps" | sed '/^$/d')
            if [ -n "$deps" ]; then echo "## Nouvelles dépendances"; printf '%s\n' "$deps" | sed 's/^/- /'; echo; fi
            # The areas to read, declared in .github/promotion-watch.
            if [ -f .github/promotion-watch ]; then
              changed=$(git diff --name-only origin/main origin/dev)
              while IFS='|' read -r title regex; do
                case "$title" in ''|'#'*) continue ;; esac
                hits=$(printf '%s\n' "$changed" | grep -E "$regex" || true)
                if [ -n "$hits" ]; then echo "## À relire : $title"; printf '%s\n' "$hits" | sed 's/^/- /'; echo; fi
              done < .github/promotion-watch
            fi
            for t in feat fix perf refactor docs test build ci chore revert; do
              lines=$(printf '%s\n' "$log" | grep -E "^$t(\(|!|:)" || true)
              if [ -n "$lines" ]; then echo "## $t"; printf '%s\n' "$lines" | sed 's/^/- /'; echo; fi
            done
          } > body.md
          pr=$(gh pr list --repo "$REPO" --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$REPO" --body-file body.md
          else
            gh pr create --repo "$REPO" --base main --head dev --draft \
              --title "chore: promotion dev → main" --body-file body.md
          fi
