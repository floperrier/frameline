# Merge — workflow GitHub Actions, déclenché par le label agent-verified
# Lit : la PR vérifiée, et .github/agent-sensitive-paths depuis la branche de base
# Écrit : auto-merge squash, ou renvoi vers toi (ready-for-human) si chemin sensible ;
#         un nouveau push sur une PR vérifiée annule la vérification
name: agent-merge
on:
  pull_request:
    types: [labeled, synchronize]
permissions:
  contents: write
  pull-requests: write
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR: ${{ github.event.pull_request.number }}
  REPO: ${{ github.repository }}
jobs:
  reset:
    if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'agent-verified')
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh pr merge "$PR" --repo "$REPO" --disable-auto || true
          gh pr edit "$PR" --repo "$REPO" --remove-label agent-verified --add-label to-verify
  merge:
    if: github.event.action == 'labeled' && github.event.label.name == 'agent-verified' && contains(github.event.pull_request.labels.*.name, 'agent')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      - run: |
          files=$(gh pr diff "$PR" --repo "$REPO" --name-only)
          if printf '%s\n' "$files" | grep -qEf .github/agent-sensitive-paths; then
            gh pr edit "$PR" --repo "$REPO" --remove-label agent-verified --add-label ready-for-human
            gh pr comment "$PR" --repo "$REPO" --body "Chemin sensible touché : revue et merge manuels."
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --auto --squash --delete-branch
